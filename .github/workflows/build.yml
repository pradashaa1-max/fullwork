name: Build Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot perl dpkg curl xz-utils git wget
          cd /tmp
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb \
            || wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb
          sudo dpkg -i libtinfo5_*.deb || true
          sudo apt-get install -f -y -qq || true
          ls /lib/x86_64-linux-gnu/libtinfo.so.5* || ls /usr/lib/x86_64-linux-gnu/libtinfo.so.5* || true

      - name: Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          rm -rf $THEOS
          git clone --depth=1 https://github.com/theos/theos $THEOS
          mkdir -p $THEOS/vendor
          git clone --depth=1 https://github.com/theos/headers $THEOS/vendor/include
          git clone --depth=1 https://github.com/theos/lib $THEOS/vendor/lib
          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks $THEOS/sdks

          cd /tmp
          curl -fL -o tc.tar.lzma \
            "https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma"
          rm -rf /tmp/tcout && mkdir -p /tmp/tcout
          tar --lzma -xf tc.tar.lzma -C /tmp/tcout
          mkdir -p $THEOS/toolchain/linux/iphone
          cp -a /tmp/tcout/ios-arm64e-clang-toolchain/. $THEOS/toolchain/linux/iphone/

          CLANG=$THEOS/toolchain/linux/iphone/bin/clang
          test -x "$CLANG"
          echo "CLANG=$CLANG" >> $GITHUB_ENV
          echo "TC_BIN=$THEOS/toolchain/linux/iphone/bin" >> $GITHUB_ENV
          echo "$THEOS/toolchain/linux/iphone/bin" >> $GITHUB_PATH
          echo "$THEOS/bin" >> $GITHUB_PATH

          if [ ! -x $THEOS/bin/dm.pl ]; then
            printf '#!/usr/bin/perl\nexec "dpkg-deb", @ARGV;\n' > $THEOS/bin/dm.pl
            chmod +x $THEOS/bin/dm.pl
          fi
          $CLANG --version | head -1

      - name: Build
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="$TC_BIN:$THEOS/bin:$PATH"
          export CC="$CLANG"
          export CXX="$TC_BIN/clang++"
          export TARGET_CC="$CC"
          export TARGET_CXX="$CXX"
          echo "CC=$CC"
          $CC --version | head -1
          make package FINALPACKAGE=1
          mkdir -p out
          find . -name "*.dylib" -exec cp -v {} out/ \;
          if ls packages/*.deb 1>/dev/null 2>&1; then
            for deb in packages/*.deb; do
              dpkg-deb -x "$deb" /tmp/xdeb
              find /tmp/xdeb -name "*.dylib" -exec cp -v {} out/ \;
            done
          fi
          ls -la out/
          test "$(ls out/*.dylib 2>/dev/null | wc -l)" -gt 0

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AstralCheat-dylib
          path: out/*.dylib
          if-no-files-found: error
