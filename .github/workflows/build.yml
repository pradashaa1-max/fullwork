name: Build Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot perl dpkg curl xz-utils git rsync
          for d in /usr/lib/x86_64-linux-gnu /lib/x86_64-linux-gnu; do
            [ -f $d/libtinfo.so.6 ] && [ ! -e $d/libtinfo.so.5 ] && sudo ln -sf libtinfo.so.6 $d/libtinfo.so.5 || true
          done

      - name: Install Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV

          # official bootstrap (ставит theos + vendor)
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos > /tmp/install-theos
          # неинтерактивно: только клон, без вопросов
          rm -rf $THEOS
          git clone --depth=1 https://github.com/theos/theos $THEOS

          # vendor include/lib вручную
          mkdir -p $THEOS/vendor
          git clone --depth=1 https://github.com/theos/headers $THEOS/vendor/include
          git clone --depth=1 https://github.com/theos/lib $THEOS/vendor/lib

          # sdks
          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks $THEOS/sdks

          # toolchain
          mkdir -p $THEOS/toolchain/linux/iphone
          cd /tmp
          curl -fL -o tc.tar.lzma \
            "https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma"
          mkdir -p /tmp/tcout
          tar --lzma -xf tc.tar.lzma -C /tmp/tcout
          # положить bin/ в нужное место
          if [ -d /tmp/tcout/ios-arm64e-clang-toolchain ]; then
            cp -a /tmp/tcout/ios-arm64e-clang-toolchain/. $THEOS/toolchain/linux/iphone/
          else
            cp -a /tmp/tcout/. $THEOS/toolchain/linux/iphone/
          fi

          CLANG=$(find $THEOS/toolchain -type f -name clang | head -1)
          echo "CLANG=$CLANG"
          test -n "$CLANG"
          echo "CLANG=$CLANG" >> $GITHUB_ENV
          TC_BIN=$(dirname "$CLANG")
          echo "TC_BIN=$TC_BIN" >> $GITHUB_ENV
          echo "$TC_BIN" >> $GITHUB_PATH
          echo "$THEOS/bin" >> $GITHUB_PATH

          # dm.pl
          if [ ! -x $THEOS/bin/dm.pl ]; then
            printf '#!/usr/bin/perl\nexec "dpkg-deb", @ARGV;\n' > $THEOS/bin/dm.pl
            chmod +x $THEOS/bin/dm.pl
          fi

          echo "=== checks ==="
          ls $THEOS/vendor/include | head -3
          ls $THEOS/vendor/lib | head -3
          ls $THEOS/sdks | head -5
          ls $TC_BIN | head -10
          $CLANG --version | head -1

      - name: Build dylib
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="$TC_BIN:$THEOS/bin:$PATH"
          export CC="$CLANG"
          export CXX="${CLANG}++"
          [ -x "$TC_BIN/clang++" ] && export CXX="$TC_BIN/clang++"
          export TARGET_CC="$CC"
          export TARGET_CXX="$CXX"

          echo "CC=$CC"
          $CC --version | head -1

          make clean || true
          make package FINALPACKAGE=1

          mkdir -p out
          find . -name "*.dylib" -print -exec cp -v {} out/ \;
          if [ -d packages ]; then
            for deb in packages/*.deb; do
              [ -f "$deb" ] || continue
              dpkg-deb -x "$deb" /tmp/xdeb
              find /tmp/xdeb -name "*.dylib" -exec cp -v {} out/ \;
            done
          fi
          ls -la out/
          test "$(ls out/*.dylib 2>/dev/null | wc -l)" -gt 0

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AstralCheat-dylib
          path: out/*.dylib
          if-no-files-found: error
