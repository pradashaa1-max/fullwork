name: Build Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot perl dpkg curl xz-utils git \
            libncurses5 libtinfo5 || true
          # ubuntu 24 may not have libtinfo5 — symlink from .6
          if [ ! -f /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi

      - name: Theos + SDK + Toolchain
        run: |
          set -e
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV

          rm -rf $THEOS
          git clone --depth=1 https://github.com/theos/theos.git $THEOS

          # vendor (headers/libs)
          cd $THEOS
          git submodule update --init --recursive || true
          # if still no vendor — pull install script pieces
          if [ ! -d "$THEOS/vendor/include" ]; then
            git clone --depth=1 https://github.com/theos/headers.git $THEOS/vendor/include || true
            git clone --depth=1 https://github.com/theos/lib.git $THEOS/vendor/lib || true
          fi

          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks

          mkdir -p $THEOS/toolchain
          cd /tmp
          curl -fL -o tc.tar.lzma \
            "https://github.com/sbingner/llvm-project/releases/download/v16.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma"
          tar --lzma -xf tc.tar.lzma -C $THEOS/toolchain 2>/dev/null \
            || (xz -d -c tc.tar.lzma | tar -xf - -C $THEOS/toolchain)

          CLANG=$(find $THEOS/toolchain -type f -name clang | head -1)
          echo "FOUND CLANG: $CLANG"
          test -n "$CLANG" && test -x "$CLANG"
          TC_BIN=$(dirname "$CLANG")
          echo "TC_BIN=$TC_BIN" >> $GITHUB_ENV
          echo "$TC_BIN" >> $GITHUB_PATH
          echo "$THEOS/bin" >> $GITHUB_PATH

          if [ ! -x "$THEOS/bin/dm.pl" ]; then
            printf '#!/usr/bin/perl\nexec "dpkg-deb", @ARGV;\n' > $THEOS/bin/dm.pl
            chmod +x $THEOS/bin/dm.pl
          fi

          ls "$THEOS/sdks" | head
          ls "$THEOS/vendor" || true
          "$CLANG" --version | head -1

      - name: Compile dylib
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="$TC_BIN:$THEOS/bin:$PATH"
          export CC="$TC_BIN/clang"
          export CXX="$TC_BIN/clang++"
          [ -x "$CXX" ] || ln -sf clang "$TC_BIN/clang++" || true
          export TARGET_CC="$CC"
          export TARGET_CXX="$CXX"

          which clang
          clang --version | head -1

          make clean || true
          make package FINALPACKAGE=1

          mkdir -p out
          find . -name "AstralCheat.dylib" -exec cp -v {} out/ \; || true
          find .theos -name "*.dylib" -exec cp -v {} out/ \; || true
          if [ -d packages ]; then
            for deb in packages/*.deb; do
              [ -f "$deb" ] || continue
              dpkg-deb -x "$deb" /tmp/xdeb
              find /tmp/xdeb -name "*.dylib" -exec cp -v {} out/ \;
            done
          fi
          ls -la out/
          test "$(ls out/*.dylib 2>/dev/null | wc -l)" -gt 0

      - name: Upload ONLY dylib
        uses: actions/upload-artifact@v4
        with:
          name: AstralCheat-dylib
          path: out/*.dylib
          if-no-files-found: error
